name: release

# A tag like v0.1.0 builds the package and publishes it to PyPI. Publishing uses PyPI's
# trusted publishing: no token is stored, and PyPI accepts only this workflow, in this
# repository, running in the `pypi` environment. After PyPI accepts the upload, the tag also
# creates the GitHub Release, with the tag's CHANGELOG.md section as its notes and the built
# files attached. A tag with no CHANGELOG section fails the build, before anything is published.
# The OpenCode plugin goes to npm as opencode-greenproof the same way: npm trusted publishing,
# accepted only from this workflow in the `npm` environment, and only after PyPI has the
# version the plugin's hook command pins.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  UV_VERSION: "0.13.5"

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: The tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test -f "dist/greenproof-${TAG#v}-py3-none-any.whl" || {
            echo "::error::tag $TAG does not match the built version:"; ls dist; exit 1; }
      - name: CHANGELOG.md has a section for the tag
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release_notes.py "${TAG#v}" > /dev/null
      - name: The wheel installs and works
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check dist/*.whl
          /tmp/wheel-check/bin/greenproof --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/greenproof/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  npm:
    name: Publish to npm
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/opencode-greenproof
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/opencode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 ships npm 11, which trusted publishing needs (11.5.1 or later)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: The tag matches the npm package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$version" = "${TAG#v}" || {
            echo "::error::tag $TAG does not match package.json version $version"; exit 1; }
      - run: node --test
      - run: npm publish --access public

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Notes from the CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release_notes.py "${TAG#v}" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "greenproof ${TAG#v}" --notes-file notes.md
